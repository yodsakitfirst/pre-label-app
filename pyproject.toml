[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-prelabel"
version = "0.1.0"
description = "Local conservative retail shelf pre-labelling"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pillow>=10,<13", "numpy>=1.26,<3", "PyYAML>=6,<7", "openpyxl>=3.1,<4", "psutil>=6,<8"]

[project.optional-dependencies]
models = ["ultralytics>=8.4.80,<9", "torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.51,<6", "safetensors>=0.5,<1"]
ocr = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
prelabel = "prelabel.cli:main"

[tool.setuptools.package-data]
prelabel = ["static/*"]

[tool.setuptools.packages.find]
include = ["prelabel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
